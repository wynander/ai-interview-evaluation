<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eval baseline</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffcf7;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e0d4;
      --pass: #166534;
      --pass-bg: #dcfce7;
      --fail: #9f1239;
      --fail-bg: #ffe4e6;
      --user: #1e3a5f;
      --user-bg: #e8f1fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 1.1rem 1.4rem 1rem;
      background: color-mix(in srgb, var(--bg) 92%, white);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .bar {
      margin: 0.75rem 0 0.85rem;
      height: 8px;
      background: var(--fail-bg);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: #16a34a;
    }
    .filters { display: flex; gap: 0.4rem; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    main { max-width: 52rem; margin: 0 auto; padding: 1rem 1.2rem 3rem; }
    .case {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: 0.7rem 0;
      overflow: hidden;
    }
    .case > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      padding: 0.85rem 1rem;
    }
    .case > summary::-webkit-details-marker { display: none; }
    .badge {
      flex: none;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
    }
    .pass .badge { color: var(--pass); background: var(--pass-bg); }
    .fail .badge { color: var(--fail); background: var(--fail-bg); }
    .title { font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
    .body { padding: 0 1rem 1rem; border-top: 1px solid var(--line); }
    .reason {
      margin: 0.85rem 0 0;
      padding: 0.65rem 0.75rem;
      background: var(--fail-bg);
      color: var(--fail);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .expected {
      margin-top: 0.85rem;
      padding: 0.75rem;
      border: 1px solid #c7d9c7;
      border-radius: 8px;
      background: #f3faf3;
    }
    .expected .bubble {
      background: white;
      border: 1px solid #dbe8db;
    }
    .turn { margin-top: 1rem; }
    .label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .bubble {
      white-space: pre-wrap;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #f6f3ec;
    }
    .bubble.user { background: var(--user-bg); color: var(--user); }
    .tools { margin-top: 0.7rem; display: grid; gap: 0.4rem; }
    .tool {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #faf8f3;
    }
    .tool > summary {
      cursor: pointer;
      padding: 0.45rem 0.7rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }
    .tool pre {
      margin: 0;
      padding: 0 0.7rem 0.7rem;
      overflow: auto;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .drop {
      margin-top: 0.75rem;
      padding: 0.7rem;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Agent evaluation</h1>
    <div class="meta" id="summary">Loading…</div>
    <div class="bar" id="barwrap" hidden><span id="bar"></span></div>
    <div class="filters">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="fail">Failed</button>
      <button type="button" data-filter="pass">Passed</button>
    </div>
    <div class="drop hidden" id="drop">No eval data in this page. Re-run <code>uv run python -m src.eval</code>.</div>
  </header>
  <main id="list"></main>
  <script type="application/json" id="eval-data">
{
  "passed": 0,
  "total": 0,
  "cases": [],
  "probes": [
    {

      "expected": "consideration-window",
      "passed": false,
      "ranked": [
        "credits-faq",
        "renewals-archived",
        "distractor-00003"
      ]
    },
    {
      "query": "when does annual subscription renew",
      "expected": "term-anniversary",
      "passed": false,
      "ranked": [

        "renewals-faq",
        "distractor-00000"
      ]
    },
    {
      "query": "how many named users does Growth include",
      "expected": "named-user-packaging",
      "passed": true,
      "ranked": [
        "seating-faq",
        "named-user-packaging",
        "renewals-wiki"
      ]
    },
    {
      "query": "how many named users does Starter include",
      "expected": "named-user-packaging",
      "passed": true,
      "ranked": [
        "seating-faq",
        "named-user-packaging",
        "renewals-wiki"
      ]
    },
    {
      "query": "when do added Growth seats appear on invoice",
      "expected": "named-user-packaging",
      "passed": false,
      "ranked": [
        "distractor-00002",
        "distractor-00004",
        "distractor-00011"
      ]
    },
    {
      "query": "business days in processing before support investigates",
      "expected": "orders",
      "passed": true,
      "ranked": [
        "orders",
        "refunds-draft",
        "cancellations"
      ]
    }
  ],
  "statics": [
    {
      "name": "dockerignore blocks .env",
      "passed": false,
      "detail": ".dockerignore must exclude .env (secret leak)"
    },
    {
      "name": "dockerfile secret hygiene",
      "passed": false,
      "detail": "COPY . . with no .dockerignore exclusion bakes .env into the image"
    },
    {

      "detail": "ok"
    },
    {
      "name": "retrieval latency probe",
      "passed": true,
      "detail": "p50 20ms over 3 probes (warn >2000ms, fail >10000ms)"
    },
    {

      "passed": false,
      "detail": "0 rows in tool_audit_log (run eval-dev first)"
    },
    {
      "name": "tickets dedup constraint",
      "passed": false,
      "detail": "no dedup unique index on tickets (add a migration)"
    },
    {
      "name": "mock auth requires key",
      "passed": false,
      "detail": "missing key returned 200, want 401"
    },
    {
      "name": "mock errors are JSON 404s",
      "passed": false,
      "detail": "got [500:text, 404:json, 500:text, 404:json, 404:json], want 5x 404:json"
    },
    {
      "name": "run_sql uses readonly role",
      "passed": false,
      "detail": "run_sql still connects as superuser (see sandbox.py TODO)"
    },
    {
      "name": "mock logs contain no API keys",
      "passed": false,
      "detail": "request headers (with keys) found in mock-apis logs"
    }
  ]
}
    </script>
  <script>
    const list = document.getElementById("list");
    const summary = document.getElementById("summary");
    const drop = document.getElementById("drop");
    let report = null;
    let filter = "all";

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function pretty(value) {
      if (typeof value === "string") return value;
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    function toolLabel(call) {
      const args = pretty(call.arguments);
      const short = args.length > 80 ? args.slice(0, 77) + "…" : args;
      return `${call.name}(${short})`;
    }

    function render() {
      if (!report) return;
      const passed = report.passed;
      const total = report.total;
      summary.textContent = `${passed} / ${total} passed`;
      document.getElementById("barwrap").hidden = false;
      document.getElementById("bar").style.width = `${total ? (passed / total) * 100 : 0}%`;
      list.innerHTML = "";
      for (const item of report.cases) {
        if (filter === "fail" && item.passed) continue;
        if (filter === "pass" && !item.passed) continue;
        const details = document.createElement("details");
        details.className = `case ${item.passed ? "pass" : "fail"}`;
        if (!item.passed) details.open = true;
        const turns = item.turns?.length ?? 0;
        const tools = (item.turns || []).reduce((n, turn) => n + (turn.tool_calls?.length || 0), 0);
        details.innerHTML = `
          <summary>
            <span class="badge">${item.passed ? "PASS" : "FAIL"}</span>
            <div>
              <div class="title">${escapeHtml(item.name)}</div>
              <div class="sub">${turns} turn${turns === 1 ? "" : "s"} · ${tools} tool call${tools === 1 ? "" : "s"}</div>
            </div>
          </summary>
          <div class="body"></div>
        `;
        const body = details.querySelector(".body");
        if (item.expected_answer || item.expected_why) {
          const expected = document.createElement("section");
          expected.className = "expected";
          expected.innerHTML = `
            <div class="label">Expected answer</div>
            <div class="bubble">${escapeHtml(item.expected_answer || "")}</div>
            <div class="label" style="margin-top:0.65rem">Why this case exists</div>
            <div class="bubble">${escapeHtml(item.expected_why || "")}</div>
          `;
          body.append(expected);
        }
        if (!item.passed && item.reason) {
          const reason = document.createElement("div");
          reason.className = "reason";
          reason.textContent = item.reason;
          body.append(reason);
        }
        (item.turns || []).forEach((turn, index) => {
          const wrap = document.createElement("section");
          wrap.className = "turn";
          wrap.innerHTML = `
            <div class="label">Turn ${index + 1}</div>
            <div class="bubble user">${escapeHtml(turn.input || "")}</div>
            <div class="label" style="margin-top:0.65rem">Response</div>
            <div class="bubble">${escapeHtml(turn.response || turn.error || "")}</div>
          `;
          if (turn.tool_calls?.length) {
            const toolsBox = document.createElement("div");
            toolsBox.className = "tools";
            for (const call of turn.tool_calls) {
              const tool = document.createElement("details");
              tool.className = "tool";
              tool.innerHTML = `
                <summary>${escapeHtml(toolLabel(call))}</summary>
                <pre>${escapeHtml(pretty(call.result))}</pre>
              `;
              toolsBox.append(tool);
            }
            wrap.append(toolsBox);
          }
          body.append(wrap);
        });
        list.append(details);
      }
    }

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll(".filters button").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        render();
      });
    });

    function load() {
      const embedded = document.getElementById("eval-data").textContent.trim();
      if (embedded) {
        report = JSON.parse(embedded);
        render();
        return;
      }
      drop.classList.remove("hidden");
    }

    drop.addEventListener("dragover", (event) => event.preventDefault());
    drop.addEventListener("drop", async (event) => {
      event.preventDefault();
      const file = event.dataTransfer?.files?.[0];
      if (!file) return;
      report = JSON.parse(await file.text());
      drop.classList.add("hidden");
      render();
    });

    load();
  </script>
</body>
</html>

[project]
name = "support-agent-interview"
version = "0.1.0"
description = "A small LangChain support agent for an applied-AI engineering interview."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0,<2",
    "langchain-openai>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "psycopg[binary]>=3.1,<4",
    "psycopg-pool>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

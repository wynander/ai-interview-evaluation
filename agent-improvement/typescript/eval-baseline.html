<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Eval baseline</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffcf7;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e0d4;
      --pass: #166534;
      --pass-bg: #dcfce7;
      --fail: #9f1239;
      --fail-bg: #ffe4e6;
      --user: #1e3a5f;
      --user-bg: #e8f1fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 1.1rem 1.4rem 1rem;
      background: color-mix(in srgb, var(--bg) 92%, white);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .bar {
      margin: 0.75rem 0 0.85rem;
      height: 8px;
      background: var(--fail-bg);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: #16a34a;
    }
    .filters { display: flex; gap: 0.4rem; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    main { max-width: 52rem; margin: 0 auto; padding: 1rem 1.2rem 3rem; }
    .case {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: 0.7rem 0;
      overflow: hidden;
    }
    .case > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      padding: 0.85rem 1rem;
    }
    .case > summary::-webkit-details-marker { display: none; }
    .badge {
      flex: none;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
    }
    .pass .badge { color: var(--pass); background: var(--pass-bg); }
    .fail .badge { color: var(--fail); background: var(--fail-bg); }
    .title { font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
    .body { padding: 0 1rem 1rem; border-top: 1px solid var(--line); }
    .reason {
      margin: 0.85rem 0 0;
      padding: 0.65rem 0.75rem;
      background: var(--fail-bg);
      color: var(--fail);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .expected {
      margin-top: 0.85rem;
      padding: 0.75rem;
      border: 1px solid #c7d9c7;
      border-radius: 8px;
      background: #f3faf3;
    }
    .expected .bubble {
      background: white;
      border: 1px solid #dbe8db;
    }
    .turn { margin-top: 1rem; }
    .label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .bubble {
      white-space: pre-wrap;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #f6f3ec;
    }
    .bubble.user { background: var(--user-bg); color: var(--user); }
    .tools { margin-top: 0.7rem; display: grid; gap: 0.4rem; }
    .tool {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #faf8f3;
    }
    .tool > summary {
      cursor: pointer;
      padding: 0.45rem 0.7rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }
    .tool pre {
      margin: 0;
      padding: 0 0.7rem 0.7rem;
      overflow: auto;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .drop {
      margin-top: 0.75rem;
      padding: 0.7rem;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .hidden { display: none; }
  </style>
</head>

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function pretty(value) {
      if (typeof value === "string") return value;
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    function toolLabel(call) {
      const args = pretty(call.arguments);
      const short = args.length > 80 ? args.slice(0, 77) + "…" : args;
      return `${call.name}(${short})`;
    }

    function render() {
      if (!report) return;
      const passed = report.passed;
      const total = report.total;
      summary.textContent = `${passed} / ${total} passed`;
      document.getElementById("barwrap").hidden = false;
      document.getElementById("bar").style.width = `${total ? (passed / total) * 100 : 0}%`;
      list.innerHTML = "";
      for (const item of report.cases) {
        if (filter === "fail" && item.passed) continue;
        if (filter === "pass" && !item.passed) continue;
        const details = document.createElement("details");
        details.className = `case ${item.passed ? "pass" : "fail"}`;
        if (!item.passed) details.open = true;
        const turns = item.turns?.length ?? 0;
        const tools = (item.turns || []).reduce((n, turn) => n + (turn.tool_calls?.length || 0), 0);
        details.innerHTML = `
          <summary>
            <span class="badge">${item.passed ? "PASS" : "FAIL"}</span>
            <div>
              <div class="title">${escapeHtml(item.name)}</div>
              <div class="sub">${turns} turn${turns === 1 ? "" : "s"} · ${tools} tool call${tools === 1 ? "" : "s"}</div>
            </div>
          </summary>
          <div class="body"></div>
        `;
        const body = details.querySelector(".body");
        if (item.expected_answer || item.expected_why) {
          const expected = document.createElement("section");
          expected.className = "expected";
          expected.innerHTML = `
            <div class="label">Expected answer</div>
            <div class="bubble">${escapeHtml(item.expected_answer || "")}</div>
            <div class="label" style="margin-top:0.65rem">Why this case exists</div>
            <div class="bubble">${escapeHtml(item.expected_why || "")}</div>
          `;
          body.append(expected);
        }
        if (!item.passed && item.reason) {
          const reason = document.createElement("div");
          reason.className = "reason";
          reason.textContent = item.reason;
          body.append(reason);
        }
        (item.turns || []).forEach((turn, index) => {
          const wrap = document.createElement("section");
          wrap.className = "turn";
          wrap.innerHTML = `
            <div class="label">Turn ${index + 1}</div>
            <div class="bubble user">${escapeHtml(turn.input || "")}</div>
            <div class="label" style="margin-top:0.65rem">Response</div>
            <div class="bubble">${escapeHtml(turn.response || turn.error || "")}</div>
          `;
          if (turn.tool_calls?.length) {
            const toolsBox = document.createElement("div");
            toolsBox.className = "tools";
            for (const call of turn.tool_calls) {
              const tool = document.createElement("details");
              tool.className = "tool";
              tool.innerHTML = `
                <summary>${escapeHtml(toolLabel(call))}</summary>
                <pre>${escapeHtml(pretty(call.result))}</pre>
              `;
              toolsBox.append(tool);
            }
            wrap.append(toolsBox);
          }
          body.append(wrap);
        });
        list.append(details);
      }
    }

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll(".filters button").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        render();
      });
    });

    function load() {
      const embedded = document.getElementById("eval-data").textContent.trim();
      if (embedded) {
        report = JSON.parse(embedded);
        render();
        return;
      }
      drop.classList.remove("hidden");
    }

    drop.addEventListener("dragover", (event) => event.preventDefault());
    drop.addEventListener("drop", async (event) => {
      event.preventDefault();
      const file = event.dataTransfer?.files?.[0];
      if (!file) return;
      report = JSON.parse(await file.text());
      drop.classList.add("hidden");
      render();
    });

    load();
  </script>
</body>
</html>
